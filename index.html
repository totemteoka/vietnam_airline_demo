        <script>
            // Game loading functionality
            (function () {
                const gameLoadingScreen =
                    document.getElementById('game-loading');
                const loadingBarFill =
                    document.getElementById('loadingBarFill');
                const loadingText = document.getElementById('loadingText');

                let currentProgress = 0;
                let targetProgress = 0;
                let isGameLoaded = false;
                let progressInterval;

                function updateProgressBar() {
                    if (Math.abs(targetProgress - currentProgress) > 0.01) {
                        currentProgress +=
                            (targetProgress - currentProgress) * 0.05;
                        const percentage = Math.round(currentProgress * 100);

                        loadingBarFill.style.webkitMask = `linear-gradient(to right, black 0%, black ${percentage}%, transparent ${percentage}%)`;
                        loadingBarFill.style.mask = `linear-gradient(to right, black 0%, black ${percentage}%, transparent ${percentage}%)`;
                        loadingText.textContent = `Loading... ${percentage}%`;

                        requestAnimationFrame(updateProgressBar);
                    }
                }

                function startFakeLoading() {
                    // Animate progress to 90% over 3-5 seconds
                    const duration = 3000 + Math.random() * 2000; // 3-5 seconds
                    const startTime = Date.now();

                    function animateProgress() {
                        const elapsed = Date.now() - startTime;
                        const progress = Math.min(elapsed / duration, 1);

                        // Easing function (ease out)
                        const eased = 1 - Math.pow(1 - progress, 3);
                        targetProgress = eased * 0.9; // Go up to 90%

                        updateProgressBar();

                        if (progress < 1) {
                            requestAnimationFrame(animateProgress);
                        }
                    }

                    animateProgress();
                }

                // Global callback for when game finishes loading
                window.onGameLoaded = function () {
                    if (isGameLoaded) return; // Prevent multiple calls

                    isGameLoaded = true;
                    console.log('Game loaded, completing loading bar...');

                    // Hide version text
                    const versionText = document.getElementById('version-text');
                    if (versionText) {
                        versionText.style.display = 'none';
                    }

                    // Animate to 100%
                    const startProgress = currentProgress;
                    const startTime = Date.now();
                    const duration = 300; // 0.3 seconds

                    function completeProgress() {
                        const elapsed = Date.now() - startTime;
                        const progress = Math.min(elapsed / duration, 1);

                        targetProgress =
                            startProgress + (1.0 - startProgress) * progress;
                        updateProgressBar();

                        if (progress < 1) {
                            requestAnimationFrame(completeProgress);
                        } else {
                            // Wait 0.5s then hide loading screen
                            setTimeout(() => {
                                hideGameLoading();
                            }, 500);
                        }
                    }

                    completeProgress();
                };

                function hideGameLoading() {
                    gameLoadingScreen.style.transition =
                        'opacity 0.5s ease-out';
                    gameLoadingScreen.style.opacity = '0';

                    setTimeout(() => {
                        gameLoadingScreen.style.display = 'none';
                    }, 500);
                }

                function showGameLoading() {
                    gameLoadingScreen.style.display = 'flex';
                    gameLoadingScreen.style.opacity = '1';
                    currentProgress = 0;
                    targetProgress = 0;
                    isGameLoaded = false;

                    // Reset progress bar
                    loadingBarFill.style.webkitMask =
                        'linear-gradient(to right, black 0%, black 0%, transparent 0%)';
                    loadingBarFill.style.mask =
                        'linear-gradient(to right, black 0%, black 0%, transparent 0%)';
                    loadingText.textContent = 'Loading... 0%';

                    // Start fake loading after a small delay
                    setTimeout(startFakeLoading, 100);
                }

                // Initialize loading screen on page load
                document.addEventListener('DOMContentLoaded', function () {
                    showGameLoading();
                });

                // Expose functions globally if needed
                window.showGameLoading = showGameLoading;
                window.hideGameLoading = hideGameLoading;
            })();
        </script>

        <script src="./vconsole.min.js"></script>
        <script type="text/javascript">
            // VConsole setup - hidden by default
            let vConsoleInstance = null;

            // Function to open/show VConsole
            window.openvconsole = function () {
                if (window.VConsole && !vConsoleInstance) {
                    vConsoleInstance = new VConsole();
                    console.log('VConsole opened');
                } else if (vConsoleInstance) {
                    vConsoleInstance.show();
                    console.log('VConsole shown');
                }
            };

            // Function to close/hide VConsole (optional)
            window.closevconsole = function () {
                if (vConsoleInstance) {
                    vConsoleInstance.hide();
                    console.log('VConsole hidden');
                }
            };

            // Function to destroy VConsole completely (optional)
            window.destroyvconsole = function () {
                if (vConsoleInstance) {
                    vConsoleInstance.destroy();
                    vConsoleInstance = null;
                    console.log('VConsole destroyed');
                }
            };

            // Debug trigger - tap 7 times to open vconsole
            (function () {
                const debugTrigger = document.getElementById('debug-trigger');
                let tapCount = 0;
                let tapTimer = null;

                console.log(
                    '[Debug Button] Initialized, element:',
                    debugTrigger
                );

                debugTrigger.addEventListener('click', function (e) {
                    tapCount++;
                    console.log('[Debug Button] Tap', tapCount, 'of 7');

                    if (tapTimer) {
                        clearTimeout(tapTimer);
                    }

                    if (tapCount >= 7) {
                        console.log(
                            '[Debug Button] 7 taps reached! Opening vconsole...'
                        );
                        window.openvconsole();
                        tapCount = 0;
                    } else {
                        tapTimer = setTimeout(function () {
                            console.log(
                                '[Debug Button] Reset tap count (timeout)'
                            );
                            tapCount = 0;
                        }, 2000);
                    }
                });

                console.log('[Debug Button] Click listener attached');
            })();
        </script>
